name: scan hebrew subtitles

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scan.js
      - name: commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
