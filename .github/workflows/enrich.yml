name: enrich hebrew metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node enrich.js
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "enrich $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push; fi
