name: hebrew dubs

# Diagnostics only. AllDebrid answers AUTH_BLOCKED to every API call from GitHub's datacenter IPs, so the real scan
# (the ffprobe proof over AllDebrid links) runs on the owner's PC: dubs_job.ps1. This job lists candidates without probing.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: titles to list
        default: "20"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: list candidates (no probing)
        run: node dubscan.js --limit "${{ github.event.inputs.limit || '20' }}" --no-probe
