name: hebrew dubs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubscan
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: can CI reach torrentio
        run: |
          for tt in tt13186482 tt29356163; do
            code=$(curl -s -o /tmp/$tt.json -w '%{http_code}' -m 40 -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/130' "https://torrentio.strem.fun/stream/movie/$tt.json")
            echo "$tt http=$code bytes=$(wc -c < /tmp/$tt.json) streams=$(grep -o infoHash /tmp/$tt.json | wc -l)"
          done
